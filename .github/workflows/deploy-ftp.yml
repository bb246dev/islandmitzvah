name: Deploy website by FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Upload static site
    runs-on: ubuntu-latest

    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Remove previous placeholder files
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp
          lftp -c "
            set cmd:fail-exit no;
            set ftp:ssl-allow true;
            open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" \"$FTP_PROTOCOL://$FTP_SERVER\";
            cd \"$FTP_SERVER_DIR\";
            rm -f index.html;
            rm -f working-logo-clean.png;
            rm -f .ftp-deploy-sync-state.json;
            bye
          "
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER || secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PROTOCOL: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR || './' }}

      - name: Upload files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER || secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          local-dir: ./
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
